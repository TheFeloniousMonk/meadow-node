# meadowprotocol.com: the reference copy of /etc/nginx/sites-available/meadow on the
# site's host. The website (web/site/) is at the root, the Meadow v1 app at /legacy/,
# the alumni club at /alumni/; the v1 API, MCP, and OAuth paths are unchanged.
# Certbot manages the TLS lines; keep them as they are on the server.

server {
    server_name meadowprotocol.com;
    root /var/www/meadow/site;

    # ---- Meadow v1 API, MCP, and OAuth: never move these (agents and connectors call them).
    location /v1/ {
        proxy_pass http://127.0.0.1:8000/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_set_header Host $host;
    }

    # Remote MCP endpoint — SSE requires no buffering and long read timeout
    # Admin MCP endpoint — same SSE settings as construct MCP
    location /mcp-admin/ {
        proxy_pass http://127.0.0.1:8000/mcp-admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /mcp/ {
        proxy_pass http://127.0.0.1:8000/mcp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # OAuth endpoints
    location /oauth/ {
        proxy_pass http://127.0.0.1:8000/oauth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The site's API catalog (RFC 9727). Exact match, so it wins over v1's /.well-known/.
    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        add_header Access-Control-Allow-Origin "*" always;
        try_files /.well-known/api-catalog =404;
    }

    # OAuth discovery (RFC 8414)
    location /.well-known/ {
        proxy_pass http://127.0.0.1:8000/.well-known/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Block common scanner probes
    location ~ ^/\.(?!well-known) {
        access_log off;
        return 404;
    }
    location ~* \.(php|aspx?|jsp|cgi|env|bak|sql|tar|gz|zip|old)$ {
        access_log off;
        return 404;
    }
    location ~* ^/(wp-admin|wp-login|wp-includes|wp-content|wordpress|xmlrpc|phpmyadmin|pma|adminer|administrator|boaform|autodiscover|vendor/phpunit|cgi-bin|actuator|console|owa|ecp|autodiscover\.xml) {
        access_log off;
        return 404;
    }

    # ---- Old v1 page addresses: permanent redirects into /legacy/, query string kept.
    location ~ ^/(login|register|support|reset-password|docs|guide|dashboard|profile|moderation)/?$ {
        return 301 /legacy$request_uri;
    }
    location ~ ^/(rooms|agents)/ {
        return 301 /legacy$request_uri;
    }
    location ~ ^/meadow-(full-onboarding|connect-your-construct)\.md$ {
        return 301 /legacy$request_uri;
    }

    # ---- Meadow v1 app (the React app in meadow-protocol, built for /legacy/).
    location = /legacy { return 301 /legacy/; }
    location ^~ /legacy/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- The alumni club (alumni/ in meadow-protocol): its own container on 127.0.0.1:8100.
    location = /alumni { return 301 /alumni/; }
    location ^~ /alumni/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256k;
        proxy_read_timeout 60s;
    }

    # ---- The old /v2/ addresses. The on-chain service card cites /v2/openapi.json and the
    # alumni pages load /v2/brand.css, so those two are served in place; the rest redirect.
    location = /v2/openapi.json {
        add_header Access-Control-Allow-Origin "*" always;
        try_files /openapi.json =404;
    }
    location = /v2/brand.css { try_files /brand.css =404; }
    location = /v2 { return 301 /; }
    location ^~ /v2/ {
        rewrite ^/v2/(.*)$ /$1 permanent;
    }

    # ---- The website.
    location = /openapi.json {
        add_header Access-Control-Allow-Origin "*" always;
        try_files /openapi.json =404;
    }
    location ~ \.md$ {
        default_type "text/markdown; charset=utf-8";
        try_files $uri =404;
    }
    location / {
        charset utf-8;
        add_header Link "</openapi.json>; rel=\"service-desc\"; type=\"application/json\", </.well-known/api-catalog>; rel=\"api-catalog\", </llms.txt>; rel=\"llms-txt\"; type=\"text/plain\"" always;
        try_files $uri $uri.html $uri/index.html =404;
        error_page 404 /404.html;
    }
    location = /404.html { internal; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/meadowprotocol.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/meadowprotocol.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = meadowprotocol.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name meadowprotocol.com;
    return 404; # managed by Certbot
}
