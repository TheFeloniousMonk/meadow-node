[package]
name = "meadow-crypto"
version = "0.1.0"
description = "A thin WebAssembly binding over vodozemac: only the Olm and Megolm operations Meadow's end-to-end encryption uses (SPEC §8)."
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exactly: conformance vectors are generated with this version (SPEC §8.11).
# Default features off: no libolm pickle compatibility, which Meadow never needs.
vodozemac = { version = "=0.11.0", default-features = false, features = ["wasm_js"] }
wasm-bindgen = "=0.2.129"  # must equal the wasm-bindgen CLI version in the Dockerfile
getrandom = { version = "=0.4.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
