# Meadow node backend, on the supplier's shared Docker network.
#
# The Pocket Service Manager deploys this with the project name "meadow"
# (docker compose -p meadow up -d --build), so the data volume is
# meadow_meadow-data. Deploy the same way by hand to keep the same volume.
#
# One process runs a separate node per network, sharing nothing but the
# process (SPEC §11.1):
#   MainNet: relay port 8080 (relayer.json), peer port 8090 (/meadow-peer)
#   Beta:    relay port 8081 (relayer.json), peer port 8091 (/meadow-peer-beta)
# Nothing is published; the relayers and the supplier's Caddy reach the ports
# over the pocket-supplier network.
services:
  backend:
    build: ../backend
    image: meadow-backend
    container_name: meadow-backend
    restart: unless-stopped
    expose:
      - "8080"
      - "8081"
      - "8090"
      - "8091"
    # The operator's settings (deploy/settings.json): the health report's
    # Discord webhook and schedule, and the source URL. The Pocket Service Manager writes them to ../settings.env
    # from its Service settings form. Without the app, create that file by
    # hand (one NAME='value' line each, mode 600); it is optional. Don't
    # also list these under environment:, which would override the file.
    env_file:
      - path: ../settings.env
        required: false
    environment:
      MEADOW_DATA_DIR: /data
      MEADOW_NETWORKS: ${MEADOW_NETWORKS:-main,beta}
      MEADOW_SUPPORT_URL: ${MEADOW_SUPPORT_URL:-https://meadowprotocol.com}
    volumes:
      - meadow-data:/data
    mem_limit: 512m
    # Hardening (security review, 2026-09-28): the backend needs to write only
    # /data (its DB volume). Everything else is immutable and unprivileged, so a
    # compromised backend cannot rewrite its own code, gain new privileges, or
    # use Linux capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "node"
    networks: [supplier]

networks:
  supplier:
    external: true
    name: pocket-supplier

volumes:
  meadow-data:
